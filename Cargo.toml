[package]
name = "greywrought"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bevy = { version = "=0.19.0", optional = true, default-features = false, features = ["default_app", "std", "multi_threaded", "bevy_winit", "x11", "3d_bevy_render", "bevy_scene", "ui_bevy_render", "default_font", "png"] }

[features]
desktop = ["dep:bevy"]

[[bin]]
name = "greywrought-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[profile.dev]
debug = 0
opt-level = 3

[profile.dev.package."*"]
opt-level = 1

[lints.rust]
unsafe_code = "forbid"

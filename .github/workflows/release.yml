name: Verify and publish Greywrought

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact sources
        uses: actions/checkout@v6
        with:

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify browser-owned schemas and controls
        run: |
          bun run test:campaign-persistence
          bun run test:input-preferences

      - name: Build all release artifacts
        run: bun run build:static

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Run dynamic browser gates
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GREYWROUGHT_LIVENESS_MILLIS: "30000"
        run: |
          bun build/host/play-server.js > /tmp/greywrought-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          bun run test:browser-playability
          bun run test:browser-encounter

      - name: Run static subpath browser gate
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          bun run serve:static > /tmp/greywrought-static.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            curl --fail --silent http://127.0.0.1:4180/greywrought/ >/dev/null && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:4180/greywrought/ >/dev/null
          bun run test:static-release

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Verify Greywrought native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Install native window libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libvulkan-dev
      - name: Run native tests
        run: cargo +1.96.1 test --locked
      - name: Build native presentation
        run: cargo +1.96.1 build --locked --features desktop --bin greywrought-desktop

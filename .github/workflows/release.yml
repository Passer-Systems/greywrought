name: Verify Greywrought native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact sources
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install Rust
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify immutable compiler source and tooling
        run: |
          bun run verify:clause-source
          bun run typecheck:tools
      - name: Run native tests
        run: cargo +1.96.1 test --locked
      - name: Build native presentation
        run: cargo +1.96.1 build --locked --features desktop --bin greywrought-desktop

name: Verify and publish Greywrought
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Play the static release
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GREYWROUGHT_GAME_URL: http://127.0.0.1:4180/greywrought/
        run: |
          bun run preview > /tmp/greywrought.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4180/greywrought/ >/dev/null && break
            sleep 0.25
          done
          bun run test:browser-playability
          bun run test:browser-encounter
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

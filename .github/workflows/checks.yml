name: Check Greywrought
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Play the built game
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GREYWROUGHT_GAME_URL: http://127.0.0.1:4180/greywrought/
        run: |
          bun run preview > /tmp/greywrought.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4180/greywrought/ >/dev/null && break
            sleep 0.25
          done
          bun run test:browser-playability
          bun run test:browser-encounter

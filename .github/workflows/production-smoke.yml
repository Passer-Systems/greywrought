name: Production smoke

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out smoke client
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - name: Verify deployed release
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          GREYWROUGHT_GAME_URL: https://passer-systems.github.io/greywrought/
        run: bun run test:production 2>&1 | tee production-smoke.log

      - name: Retain smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ github.run_id }}
          path: production-smoke.log
          retention-days: 14
